name: Build APK

on:
  push:
    branches: [main, 'vibe/gw-fixes-cbb2e3']
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build signed APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Publish APK to gw-website
        run: |
          mkdir -p gw-apk
          cp android/app/build/outputs/apk/release/app-release.apk "gw-website/Gw esports.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "gw-apk/Gw esports.apk"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "gw-website/Gw esports.apk" "gw-apk/Gw esports.apk"
          if git diff --cached --quiet; then
            echo "No APK changes to commit"
          else
            git commit -m "ci: rebuild GW eSports APK"
            git push
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gw-esports-apk
          path: android/app/build/outputs/apk/release/app-release.apk
