 if(name==='wallet'){
  const walletPayload=JSON.stringify({deposit:pages.deposit,withdraw:pages.withdraw}).replace(/</g,'\\u003c');

ntentWindow.postMessage(lastData,'*');if(history)setTimeout(()=>{const doc=f.contentDocument;const h=[...doc.querySelectorAll('h2,h3,h4')].find(x=>/history|vault & escrow log/i.test(x.textContent));h?.scrollIntoView({behavior:'smooth',block:'start'})},700)}}document.getElementById('deposit').onclick=()=>set('deposit',false);document.getElementById('withdraw').onclick=()=>set('withdraw',false);document.getElementById('deposit-history').onclick=()=>set('deposit',true);document.getElementById('withdraw-history').onclick=()=>set('withdraw',true);set('deposit',false);<\/script></body></html>`;
